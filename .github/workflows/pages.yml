name: Publish Timeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the project
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate and build dated puzzles
        run: node scripts/build-puzzles.mjs
      - name: Test game logic and UI handlers
        run: node --test tests/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
